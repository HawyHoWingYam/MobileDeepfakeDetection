name: aware-net
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python Environment
  - python=3.10.12
  
  # Core Deep Learning (Auto-managed by tools/environment_manager.py)
  # PyTorch packages installed based on GPU compatibility:
  # RTX 50-series: nightly cu129, RTX 30/40: stable cu124, CPU: stable
  # Use: python tools/environment_manager.py for optimal installation
  
  # Scientific Computing
  - numpy=1.24.3
  - pandas=2.0.3
  - scipy=1.11.1
  - scikit-learn=1.3.0
  - matplotlib=3.7.2
  - seaborn=0.12.2
  
  # Computer Vision & Image Processing
  - opencv=4.8.0
  - pillow=10.0.0
  - imageio=2.31.1
  
  # Machine Learning Extensions
  - lightgbm=4.0.0
  - xgboost=1.7.6
  
  # Development Tools
  - jupyter=1.0.0
  - ipykernel=6.25.0
  - pytest=7.4.0
  - pytest-cov=4.1.0
  - black=23.7.0
  - flake8=6.0.0
  - mypy=1.5.1
  
  # Utilities
  - tqdm=4.65.0
  - pyyaml=6.0.1
  - requests=2.31.0
  - psutil=5.9.5
  
  # Pip dependencies
  - pip=23.2.1
  - pip:
    - timm==1.0.19             # Pre-trained models library (Latest 2025)
    - albumentations==1.3.1    # Advanced data augmentation
    - wandb==0.15.8           # Experiment tracking
    - tensorboard==2.14.0     # Training visualization
    - onnx==1.14.1           # Model export format
    - onnxruntime==1.15.1    # ONNX inference
    - grad-cam==1.4.8        # Model interpretability
    - efficientnet-pytorch==0.7.1  # EfficientNet models
    - pretrainedmodels==0.7.4      # Additional pre-trained models
    - pytorch-lightning==2.0.7     # Training framework
    - torchmetrics==1.0.3          # Metrics computation
    - torch-optimizer==0.3.0       # Additional optimizers
    - kornia==0.7.0               # Computer vision operators
    - facenet-pytorch==2.5.3      # Face detection utilities
    - mtcnn==0.1.1                # Face detection
    - insightface==0.7.3          # Face analysis toolkit